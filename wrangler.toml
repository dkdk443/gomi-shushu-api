name = "gomi-shushu-api"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# workers.dev のURLだけを使う。API_TOKEN はここに書かず、wrangler secret put で設定する
workers_dev = true
preview_urls = false

# 毎日7時（日本時間）に当日の、20時に翌日のごみを LINE に通知する。cron は UTC で書く
[triggers]
crons = ["0 22 * * *", "0 11 * * *"]

# 通知カードの画像。LINE のサーバーが取りに来るので、認証より先に配る（public/ に秘密のものは置かない）
[assets]
directory = "./public"
